    </div>
  </div>
</div>
<script>
(function(){
  try {
    var KEY = 'hd_notice_20260829_dismissed';
    if (localStorage.getItem(KEY) === '1') return;
    var overlay = document.getElementById('hd-notice-overlay');
    if (!overlay) return;
    overlay.style.display = 'flex';
    function close(){ overlay.style.display='none'; try{localStorage.setItem(KEY,'1');}catch(e){} }
    document.getElementById('hd-notice-close').addEventListener('click', close);
    overlay.addEventListener('click', function(e){ if(e.target===overlay) close(); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
  } catch(e) {}
})();
</script>
